name: BiitCoin headless smoke test

on:
  push:
    branches:
      - "biitcoin/**"
    paths:
      - "src/**"
      - "contrib/biitcoin/**"
      - ".github/workflows/biitcoin-smoke.yml"
  pull_request:
    paths:
      - "src/**"
      - "contrib/biitcoin/**"
      - ".github/workflows/biitcoin-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  biitcoin-smoke:
    name: Build and test two local nodes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake python3 libboost-dev
      - name: Configure headless walletless node
        run: cmake -S . -B build -DBUILD_GUI=OFF -DENABLE_IPC=OFF -DENABLE_WALLET=OFF -DBUILD_TESTS=OFF
      - name: Build node and RPC client
        run: cmake --build build --target bitcoind bitcoin-cli -j2
      - name: Run loopback-only smoke test
        run: python3 contrib/biitcoin/smoke_test.py --bindir build/bin
